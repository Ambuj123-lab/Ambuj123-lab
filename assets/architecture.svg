  <text x="385" y="504" class="node-sub">Pinecone · cosine score</text>
</g>

<!-- Node 6: Web Search -->
<g>
  <rect class="glass-box node-anim" x="320" y="520" width="190" height="60" rx="12" stroke="#3b82f6"/>
