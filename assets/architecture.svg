<!-- Node 11: Fallback -->
<g>
  <rect class="glass-box node-anim" x="855" y="420" width="170" height="55" rx="12" stroke="#ef4444"/>
  <text x="870" y="452" class="emoji">🆘</text>
  <text x="918" y="443" class="node-num" fill="#ef4444">NODE 11</text>
  <text x="918" y="459" class="node-title" fill="#ef4444">Fallback</text>
</g>

<!-- Flow lines from Classifier (Node 1) to Nodes 2-7 -->
<path class="flow-line flow-red" d="M240,430 C 280,430 280,290 320,290"/>
<circle r="3" fill="#ff4d6a" class="particle"><animateMotion dur="2.5s" repeatCount="indefinite" path="M240,430 C 280,430 280,290 320,290"/></circle>

<path class="flow-line flow-green" d="M240,440 C 270,440 270,350 320,350"/>
<circle r="3" fill="#10ffa0" class="particle"><animateMotion dur="2.2s" repeatCount="indefinite" path="M240,440 C 270,440 270,350 320,350"/></circle>

<path class="flow-line flow-orange" d="M240,450 C 260,450 260,412 320,412"/>
<circle r="3" fill="#ff6b35" class="particle"><animateMotion dur="2.0s" repeatCount="indefinite" path="M240,450 C 260,450 260,412 320,412"/></circle>

<path class="flow-line flow-cyan" d="M240,460 C 260,460 260,480 320,480"/>
<circle r="4" fill="#00e5ff" class="particle"><animateMotion dur="1.8s" repeatCount="indefinite" path="M240,460 C 260,460 260,480 320,480"/></circle>

<path class="flow-line flow-blue" d="M240,470 C 270,470 270,550 320,550"/>
<circle r="4" fill="#3b82f6" class="particle"><animateMotion dur="2.1s" repeatCount="indefinite" path="M240,470 C 270,470 270,550 320,550"/></circle>

<path class="flow-line flow-green" d="M240,480 C 280,480 280,620 320,620"/>
<circle r="4" fill="#10b981" class="particle"><animateMotion dur="2.4s" repeatCount="indefinite" path="M240,480 C 280,480 280,620 320,620"/></circle>


<!-- Flow lines from Tools (5, 6, 7) to Generator (8) -->
<path class="flow-line flow-cyan" d="M510,480 C 550,480 550,535 590,535"/>
<circle r="4" fill="#00e5ff" class="particle"><animateMotion dur="1.5s" repeatCount="indefinite" path="M510,480 C 550,480 550,535 590,535"/></circle>

<path class="flow-line flow-blue" d="M510,550 L590,550"/>
<circle r="4" fill="#3b82f6" class="particle"><animateMotion dur="1.5s" repeatCount="indefinite" path="M510,550 L590,550"/></circle>

<path class="flow-line flow-green" d="M510,620 C 550,620 550,565 590,565"/>
<circle r="4" fill="#10b981" class="particle"><animateMotion dur="1.5s" repeatCount="indefinite" path="M510,620 C 550,620 550,565 590,565"/></circle>

<!-- Flow: Generator to Guard -->
<path class="flow-line flow-amber" d="M770,550 L840,550"/>
<circle r="4" fill="#fbbf24" class="particle"><animateMotion dur="1.5s" repeatCount="indefinite" path="M770,550 L840,550"/></circle>

<!-- Flow: Guard to PostProcess -->
<path class="flow-line flow-violet" d="M940,585 L940,630"/>
<circle r="4" fill="#ee0979" class="particle"><animateMotion dur="1.2s" repeatCount="indefinite" path="M940,585 L940,630"/></circle>

<!-- Flow: Guard to Fallback -->
<path class="flow-line flow-red" d="M940,515 L940,475"/>
<circle r="4" fill="#ef4444" class="particle"><animateMotion dur="1.2s" repeatCount="indefinite" path="M940,515 L940,475"/></circle>


<!-- ═══ SECTION 3: INFRASTRUCTURE ═══ -->
<rect x="50" y="745" width="1000" height="170" rx="16" fill="url(#sectionGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="6,4"/>
<text x="75" y="770" class="section-label" fill="rgba(167,139,250,0.3)">INFRASTRUCTURE</text>

<!-- Pinecone -->
<g>
  <rect class="glass-box node-anim" x="80" y="795" width="170" height="60" rx="10" stroke="#10ffa0"/>
  <text x="100" y="830" class="emoji">🌲</text>
  <text x="140" y="825" class="node-title" fill="#10ffa0">Pinecone</text>
  <text x="140" y="840" class="node-sub">14,662 Vectors (MRL)</text>
</g>

<!-- Supabase -->
