  <text x="70" y="457" class="emoji">🧠</text>
  <text x="118" y="450" class="node-num" fill="#a78bfa">NODE 1</text>
  <text x="118" y="467" class="node-title" fill="#a78bfa">Classifier</text>
  <text x="118" y="483" class="node-sub">6 paths · Zero API call</text>
</g>

<!-- Node 2: Reject -->
<g>
