<!-- Node 9: Hallucination Guard -->
<g>
  <rect class="glass-box node-anim" x="840" y="515" width="200" height="70" rx="14" stroke="#ee0979"/>
  <text x="860" y="555" class="emoji">🛡️</text>
  <text x="915" y="542" class="node-num" fill="#ee0979">NODE 9 · JUDGE</text>
  <text x="915" y="558" class="node-title" fill="#ee0979">HallucinationGuard</text>
  <text x="915" y="574" class="node-sub">grounded ✓ · hallucinated ✗</text>
</g>

<!-- Node 10: PostProcess -->
<g>
  <rect class="glass-box node-anim" x="845" y="630" width="190" height="60" rx="14" stroke="#00f2fe"/>
  <text x="865" y="665" class="emoji">⚙️</text>
  <text x="913" y="657" class="node-num" fill="#00f2fe">NODE 10</text>
  <text x="913" y="673" class="node-title" fill="#00f2fe">PostProcess</text>
